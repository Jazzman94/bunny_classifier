[project]
name = "bunny-classifier"
version = "0.1.0"
description = "Image classifier for bunny poses/activities — training pipeline and inference API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.4",
]

[project.scripts]
bunny-data = "bunny_classifier.data.cli:main"
bunny-train = "bunny_classifier.training.cli:main"

[project.optional-dependencies]
# Prod image installs only `serve` (ROADMAP §6 Phase 0/6).
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "mlflow>=2.16",
    "tensorboard>=2.17",
    "pyyaml>=6.0",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "onnxruntime>=1.19",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "numpy>=1.26",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bunny_classifier"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bunny_classifier"]
mypy_path = "src"

[[tool.mypy.overrides]]
# train-extra dependencies; CI type-checks without them installed.
module = ["torch.*", "torchvision.*", "mlflow.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Without torch installed, torch.utils.data.Dataset resolves to Any; subclassing Any
# is forbidden by strict mode, so relax that single check for the torch-dependent module.
module = "bunny_classifier.data.dataset"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# Same story for the training loop: torch symbols are Any when the extra is absent,
# which makes strict mode flag otherwise well-typed calls and decorators.
module = ["bunny_classifier.training.train", "bunny_classifier.models.backbone"]
disallow_any_decorated = false
disallow_untyped_calls = false
disallow_untyped_decorators = false  # @torch.no_grad() is Any without the extra

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
