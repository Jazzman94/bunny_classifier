[project]
name = "bunny-classifier"
version = "0.1.0"
description = "Image classifier for bunny poses/activities — training pipeline and inference API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Prod image installs only `serve` (ROADMAP §6 Phase 0/6).
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "mlflow>=2.16",
    "tensorboard>=2.17",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "onnxruntime>=1.19",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "numpy>=1.26",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bunny_classifier"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bunny_classifier"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
